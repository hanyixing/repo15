# Electron Builder Configuration
# Packages the Kiss web application as a desktop app

appId: org.kissweb.desktop
productName: Kiss Desktop
copyright: Copyright © 2024 Kiss Framework

directories:
  output: dist/electron
  buildResources: build-resources

files:
  - "start-electron.js"
  - "package.json"
  - "node_modules/**"
  - "tomcat/**"
  - "work/exploded/**"
  - "libs/**"
  - "src/main/backend/**"
  - "src/main/frontend/**"
  - "src/main/core/**"
  - "src/main/precompiled/**"
  - "bld"
  - "SimpleWebServer.jar"

extraResources:
  - from: "tomcat/"
    to: "tomcat/"
    filter:
      - "**/*"
      - "!logs/*"
      - "!temp/*"
      - "!work/*"
  - from: "libs/"
    to: "libs/"

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build-resources/icon.ico

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  icon: build-resources/icon.icns
  category: public.app-category.business

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  icon: build-resources/icon.png
  category: Office

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

publish:
  provider: generic
  url: https://kissweb.org/releases
