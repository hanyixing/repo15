[main]
# Development Environment Configuration
# =====================================

# Database: SQLite for local development (zero config)
DatabaseType = SQLite
DatabaseHost = localhost
DatabaseName = DB.sqlite
DatabaseUser = ""
DatabasePassword = ""

# Higher thread count for development testing
MaxWorkerThreads = 30

# Shorter timeout for development
UserInactiveSeconds = 900

# Development-friendly connection pool settings
DatabaseMinPoolSize = 5
DatabaseInitialPoolSize = 5
DatabaseMaxPoolSize = 20
DatabaseAcquireIncrement = 5
DatabaseMaxStatements = 500
DatabaseMaxStatementsPerConnection = 25
DatabaseIdleTestPeriod = 300
DatabaseMaxIdleTime = 1800
DatabaseTestOnCheckout = false
DatabaseTestOnCheckin = true
DatabaseHelperThreads = 3
DatabaseUnreturnedTimeout = 60
DatabaseDebugStackTraces = true
