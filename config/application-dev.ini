#
# Development environment configuration (SQLite, no secrets).
# Selected by:  ./deploy.sh dev
#
# This file is application-neutral: SQLite is one of the five first-class
# databases Kiss supports and needs no server, which makes it ideal for
# local development.  It contains no credentials.
#
[main]

DatabaseType = SQLite
DatabaseHost = localhost
DatabaseName = DB.sqlite
DatabaseUser = ""
DatabasePassword = ""

# Max number of simultaneous REST services (any additional are queued)
MaxWorkerThreads = 30

# If a user is inactive for this many seconds, they get auto-logged off
UserInactiveSeconds = 900
