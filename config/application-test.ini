#
# Test / CI environment configuration (SQLite, no secrets).
# Selected by:  ./deploy.sh test
#
# Uses a throwaway SQLite database and a deliberately small connection pool
# so it runs cheaply on CI runners.  No credentials are stored here.
#
[main]

DatabaseType = SQLite
DatabaseHost = localhost
DatabaseName = test.sqlite
DatabaseUser = ""
DatabasePassword = ""

# Keep the footprint small for CI runners.
MaxWorkerThreads = 5
UserInactiveSeconds = 900

# Minimal C3P0 pool for CI.
DatabaseMinPoolSize = 1
DatabaseInitialPoolSize = 1
DatabaseMaxPoolSize = 5
