[main]
# Test/CI Environment Configuration
# ==================================

# Database: PostgreSQL for integration testing
# (matches CI docker-compose test database)
DatabaseType = PostgreSQL
DatabaseHost = localhost
DatabasePort = 5433
DatabaseName = kiss_test
DatabaseSchema = public
DatabaseUser = kiss_test
DatabasePassword = kiss_test_pass

# Standard thread count for tests
MaxWorkerThreads = 10

# Short timeout for tests
UserInactiveSeconds = 300

# Smaller pool for tests
DatabaseMinPoolSize = 3
DatabaseInitialPoolSize = 3
DatabaseMaxPoolSize = 15
DatabaseAcquireIncrement = 3
DatabaseMaxStatements = 250
DatabaseMaxStatementsPerConnection = 10
DatabaseIdleTestPeriod = 60
DatabaseMaxIdleTime = 300
DatabaseTestOnCheckout = true
DatabaseTestOnCheckin = true
DatabaseHelperThreads = 2
DatabaseUnreturnedTimeout = 30
DatabaseDebugStackTraces = true
