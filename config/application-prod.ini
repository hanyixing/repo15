#
# Production environment configuration.
# Selected by:  ./deploy.sh prod
#
# This file contains NO secrets.  DatabaseUser and DatabasePassword are left
# empty ON PURPOSE and MUST be injected at deploy time, e.g.:
#   * docker-entrypoint.sh maps the DATABASE_USER / DATABASE_PASSWORD
#     environment variables into the deployed application.ini, or
#   * your orchestrator / deploy.sh writes them into the deployed copy.
# Never commit real credentials here (see the secrets rule in CLAUDE.md).
#
# PostgreSQL is used as the example production database because it is one of
# the five first-class databases Kiss supports and its driver is already
# fetched by the build.  Swap DatabaseType/Port for another supported vendor
# as needed.
#
[main]

DatabaseType = postgresql
DatabaseHost = localhost
DatabasePort = 5432
# Generic placeholder name --- override for your deployment (env or deploy.sh).
DatabaseName = appdb
# Injected at run time --- do not hard-code credentials.
DatabaseUser = ""
DatabasePassword = ""

# Max number of simultaneous REST services (any additional are queued)
MaxWorkerThreads = 100

# If a user is inactive for this many seconds, they get auto-logged off
UserInactiveSeconds = 900

# Production always requires authentication.
RequireAuthentication = true

# ===== C3P0 connection pool (production values) =====
DatabaseMinPoolSize = 10
DatabaseInitialPoolSize = 10
DatabaseMaxPoolSize = 100
DatabaseAcquireIncrement = 5
DatabaseCheckoutTimeout = 10000
DatabaseMaxStatements = 500
DatabaseMaxStatementsPerConnection = 25
DatabaseIdleTestPeriod = 300
DatabaseMaxIdleTime = 1800
DatabaseTestOnCheckin = true
