# ==============================================================================
# docker-compose.yml - Kiss Framework Application
# ==============================================================================
#
# Usage:
#   Default (web + db):
#     docker compose up -d
#
#   Development mode (with hot-reload volume mounts):
#     docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
#   Production mode (with restart policies and resource limits):
#     docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
#   Tear down:
#     docker compose down
#     docker compose down -v   # also removes the database volume
#
# ==============================================================================

services:
  # --------------------------------------------------------------------------
  # PostgreSQL 16
  # --------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: kiss-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: kissdb
      POSTGRES_USER: kiss
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kiss_secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Not exposed to host by default; override in dev/prod compose files
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiss -d kissdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - kiss-network

  # --------------------------------------------------------------------------
  # Kiss Application (Tomcat 11)
  # --------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kiss-web
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Database connection — matches the db service
      DatabaseType: postgresql
      DatabaseHost: db
      DatabasePort: 5432
      DatabaseName: kissdb
      DatabaseUser: kiss
      DatabasePassword: ${DB_PASSWORD:-kiss_secret}
    volumes:
      # Override application.ini at runtime if needed
      - ./config/application-prod.ini:/app/application.ini:ro
    networks:
      - kiss-network

volumes:
  pgdata:
    driver: local

networks:
  kiss-network:
    driver: bridge
